[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pakgrid"
version = "0.1.0"
description = "Pakistan National Grid: fixed, numbered ~1 km cells and ~200 m sub-cells with GPS-linked boundaries and centroids"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.optional-dependencies]
django = ["Django>=4.2", "djangorestframework>=3.14"]
test = ["pytest>=7", "pyproj>=3", "Django>=4.2", "djangorestframework>=3.14"]

[project.scripts]
pakgrid = "pakgrid.cli:main"

[tool.setuptools.packages.find]
include = ["pakgrid*"]

[tool.setuptools.package-data]
pakgrid = ["py.typed", "data/*.geojson.gz", "data/*.json.gz", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Django writes the migrations; they are left as it made them.
extend-exclude = ["pakgrid/contrib/walkthroughs/migrations"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E, W), import order (I), likely bugs (B), modern syntax (UP)
select = ["F", "E", "W", "I", "B", "UP"]
# zip(..., strict=True) would change behaviour: many zips pair a list with its own tail on purpose
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# the viewer tests hold the JavaScript they run in long string literals
"tests/test_viewer_js.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pakgrid"]

[tool.mypy]
# Every function is typed; `python -m mypy` checks the package (CI runs it on each push).
files = ["pakgrid"]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Django, Django REST framework and Celery (used only by pakgrid.contrib) ship no type information.
module = ["django.*", "rest_framework.*", "celery.*"]
ignore_missing_imports = true
