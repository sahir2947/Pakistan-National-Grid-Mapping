name: Feature request
description: Suggest something pakgrid should do that it does not do today.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        pakgrid is a standalone library: a feature must be useful to any app that uses it, not
        built around one app's own code. Please describe the need; the owner decides whether and
        how it is built.
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task, and who it is for (a rider, a shop owner, an app's backend, ...).
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Why pakgrid does not do it today
      description: What you tried, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
      description: How it could work, for example the call or command you would like.
