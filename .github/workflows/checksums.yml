name: Official checksums

# Builds both complete databases from scratch on Linux, macOS and Windows and
# checks each against the official checksum in pakgrid/checksums.py. This is
# the proof that anyone, on any machine, builds exactly the official grid.
#
# After a merge to main (push), only Linux and Windows run: the same code has
# already passed on all three systems in its pull request, and macOS runners
# are sometimes unavailable for long enough that GitHub cancels the job.

on:
  push:
    branches: [main]
    paths: ["pakgrid/**", "pyproject.toml", ".github/workflows/checksums.yml"]
  pull_request:
    paths: ["pakgrid/**", "pyproject.toml", ".github/workflows/checksums.yml"]
  workflow_dispatch:

concurrency:
  group: checksums-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Pakistan edition
        run: |
          python -m pakgrid build -o pakgrid_v1_pakistan.sqlite --pakistan-only
          python -m pakgrid verify --db pakgrid_v1_pakistan.sqlite

      - name: Full edition
        run: |
          python -m pakgrid build -o pakgrid_v1.sqlite
          python -m pakgrid verify --db pakgrid_v1.sqlite
