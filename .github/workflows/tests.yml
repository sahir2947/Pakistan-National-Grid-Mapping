name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # The grid must come out identical on every operating system.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node runs the map viewer's JavaScript in tests/test_viewer_js.py.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff==0.17.5

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install mypy==2.4.1
          python -m mypy

      - name: Test
        # The viewer and conformance tests need Node: fail rather than skip them without it.
        env:
          PAKGRID_REQUIRE: node
        run: python -m pytest -q

  integrations:
    # The walkthrough Django app on PostgreSQL (where its concurrency rules are tested with two
    # connections), with real ffmpeg photos and the Celery task. Nothing here may be skipped.
    name: Django on PostgreSQL, with ffmpeg and Celery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "psycopg[binary]" celery

      - name: Test
        env:
          PAKGRID_TEST_POSTGRES: localhost:5432
          PAKGRID_REQUIRE: postgres,ffmpeg,celery
        run: python -m pytest -q -rs tests/test_django_walkthroughs.py tests/test_walkthrough.py

  package:
    # What users get from pip: the wheel and the source package, each installed into a clean
    # environment and checked from outside the checkout (scripts/check_installed_package.py).
    name: Installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build -o dist .

      - name: Install and check the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/pakgrid-*.whl
          wheel-env/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_package.py" \
            "$(python -c "import tomllib; print(tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml','rb'))['project']['version'])")"

      - name: Install and check the source package
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv sdist-env
          sdist-env/bin/pip install "$GITHUB_WORKSPACE"/dist/pakgrid-*.tar.gz
          sdist-env/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_package.py" \
            "$(python -c "import tomllib; print(tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml','rb'))['project']['version'])")"
