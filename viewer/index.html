<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Grid Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #e5e7eb; --accent: #d9480f;
    --panel-shadow: 0 2px 12px rgba(0, 0, 0, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f2328; --fg: #e6e8eb; --muted: #9aa3ad; --line: #3a4048; --accent: #ff7a3d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; z-index: 1000; top: 10px; left: 56px; right: 10px; display: flex; gap: 6px;
         flex-wrap: wrap; max-width: 640px; }
  .bar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
               background: var(--bg); color: var(--fg); font-size: 14px; box-shadow: var(--panel-shadow); }
  .bar button, .panel button { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
               background: var(--bg); color: var(--fg); font-size: 14px; box-shadow: var(--panel-shadow); }
  .bar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { position: absolute; z-index: 1000; right: 10px; top: 64px; width: 340px; max-height: calc(100% - 84px);
           overflow: auto; background: var(--bg); border-radius: 10px; box-shadow: var(--panel-shadow); padding: 12px 14px; }
  .panel h2 { margin: 0 0 2px; font-size: 16px; }
  .panel h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .code { font: 700 20px/1.2 ui-monospace, Menlo, Consolas, monospace; color: var(--accent); overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
  td.num { font-family: ui-monospace, Menlo, Consolas, monospace; text-align: right; }
  .status { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 22px;
            background: rgba(31, 41, 55, .86); color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 13px;
            pointer-events: none; white-space: nowrap; }
  .quad-label { font: 700 22px/1.1 system-ui, sans-serif; color: #111827; text-align: center;
                text-shadow: 0 0 4px #fff, 0 0 4px #fff; white-space: nowrap; }
  .quad-label small { display: block; font-size: 12px; font-weight: 500; }
  .cell-label { font: 600 10px/1 ui-monospace, Menlo, monospace; color: #1e3a8a; text-shadow: 0 0 3px #fff;
                white-space: nowrap; text-align: center; }
  .sub-label { font: 600 11px/1 ui-monospace, Menlo, monospace; color: #9a3412; text-shadow: 0 0 3px #fff; text-align: center; }
  .leaflet-tooltip.corner { font-size: 12px; }
  .hide { display: none; }
  .bar label.toggle { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--line);
                      border-radius: 8px; background: var(--bg); box-shadow: var(--panel-shadow); cursor: pointer; }
  .nav-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nav-main { display: flex; align-items: center; gap: 14px; margin: 12px 0 6px; }
  .nav-big { width: 84px; height: 84px; flex: none; display: flex; align-items: center; justify-content: center;
             border-radius: 50%; background: rgba(220, 38, 38, .08); font-size: 44px; color: #16a34a; }
  .nav-big svg { width: 64px; height: 64px; }
  .nav-dist { font: 700 30px/1.1 system-ui, sans-serif; }
  .nav-dir { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .nav-turn { font-size: 15px; color: var(--accent); font-weight: 600; text-transform: capitalize; }
  .nav-hint { color: var(--muted); }
  .nav-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .panel button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel button.go { background: #dc2626; border-color: #dc2626; color: #fff; }
  .bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel textarea { width: 100%; box-sizing: border-box; min-height: 92px; font: 12px/1.4 ui-monospace, Menlo, monospace;
                    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .panel input.name { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px;
                      background: var(--bg); color: var(--fg); font-size: 14px; }
  .error { color: #dc2626; font-weight: 600; }
  .around { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
  .around input[type=number] { width: 84px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px;
                               background: var(--bg); color: var(--fg); }
  .around select { padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .panel button:disabled { opacity: .5; cursor: default; }
  .nav-target, .nav-rider { pointer-events: none; }
  .nav-rider { pointer-events: auto; cursor: grab; }
  .arrow-head { pointer-events: none; }
  .arrow-head svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 2px #fff); }
  .panel a.place { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
  .panel a.place:hover { text-decoration: underline; }
  .warn { color: #b45309; font-weight: 600; }
  .place-list { max-height: 220px; overflow: auto; margin: 4px 0; padding: 0; list-style: none; }
  .place-list li { padding: 3px 0; border-bottom: 1px solid var(--line); }
  .legend span { display: inline-block; width: 14px; height: 10px; margin-right: 6px; vertical-align: middle;
                 border: 2px solid; }
  @media (max-width: 640px) {
    .bar { left: 52px; }
    .panel { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto; max-height: 45%; }
    .status { bottom: auto; top: 108px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<form class="bar" id="search">
  <input id="q" type="search" autocomplete="off" spellcheck="false"
         placeholder="Place (Taxila), address (11-0140-0471-00 W23 S18), code, or lat, lon" aria-label="Search">
  <button class="primary" type="submit">Go</button>
  <button type="button" id="me" title="Find my grid block">My location</button>
  <label class="toggle"><input type="checkbox" id="pkonly"> Pakistan only</label>
  <label class="toggle" title="Colour each block by its tehsil"><input type="checkbox" id="placeson"> Places</label>
  <label class="toggle" title="Show or hide the rectangle, quadrants, cells and sub-cells"><input type="checkbox" id="gridon" checked> Grid</label>
  <button type="button" id="measure" title="Distance and direction between two blocks: tap one, then the other">Measure</button>
  <button type="button" id="zonebtn" title="Draw a delivery zone, check pins against it, and copy its data">Zone</button>
  <button type="button" id="draw" title="Draw a new locality and see the sub-cells it would tag">Draw</button>
</form>
<div class="panel" id="panel"></div>
<div class="status" id="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="layout.js"></script>
<script src="boundary.js"></script>
<script src="places.js"></script>
<script src="pakgrid.js"></script>
<script src="navigation.js"></script>
<script>
(function () {
  "use strict";
  var grid = new PakGrid.Grid(PAKGRID_LAYOUT);
  var border = new PakGrid.Boundary(PAKGRID_BOUNDARY);
  var places = new PakGrid.Places(PAKGRID_PLACES);
  var B = grid.bounds, M = grid.mid;
  var FLAG = PakGrid.FLAG_NAMES;
  // cell and sub-cell line styles by border flag: outside, border, inside
  var CELL_STYLE = [{ color: "#9ca3af", weight: 1, opacity: 0.6, dashArray: "3 3" },
                    { color: "#7c3aed", weight: 1.5, opacity: 0.9 },
                    { color: "#1d4ed8", weight: 1, opacity: 0.8 }];
  var SUB_STYLE = [{ color: "#9ca3af", weight: 0.5, opacity: 0.5 },
                   { color: "#a855f7", weight: 0.8, opacity: 0.8 },
                   { color: "#ea580c", weight: 0.7, opacity: 0.7 }];
  var CELL_ZOOM = 11, SUB_ZOOM = 14, CELL_LABEL_ZOOM = 13, SUB_LABEL_ZOOM = 16, LIMIT = 6000;
  var QUAD_COLOURS = ["#3b82f6", "#16a34a", "#f59e0b", "#e11d48"];  // 00 01 10 11

  // Keep the search bar and the info panel from covering what we zoom to.
  function viewPadding() {
    return window.innerWidth > 640
      ? { paddingTopLeft: [20, 70], paddingBottomRight: [370, 20] }
      : { paddingTopLeft: [20, 120], paddingBottomRight: [20, Math.round(window.innerHeight * 0.47)] };
  }
  var map = L.map("map", { zoomControl: true, worldCopyJump: false, zoomSnap: 0.25 })
    .fitBounds([[B.south, B.west], [B.north, B.east]], viewPadding());
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' +
      ' · Border: <a href="https://www.geoboundaries.org">geoBoundaries</a> · Tehsils: UN OCHA (CC BY-IGO 3.0)' +
      ' · Localities: OpenStreetMap via HOT (ODbL)'
  }).addTo(map);
  var canvas = L.canvas({ padding: 0.3 });

  // -- Rectangle, quadrants, midlines and corners ------------------------
  var frame = L.layerGroup().addTo(map);
  grid.quadrants.forEach(function (ql) {
    L.rectangle([[ql.south, ql.west], [ql.north, ql.east]], {
      color: QUAD_COLOURS[ql.q], weight: 1, fillColor: QUAD_COLOURS[ql.q], fillOpacity: 0.10, interactive: false
    }).addTo(frame);
    L.marker([(ql.south + ql.north) / 2, (ql.west + ql.east) / 2], {
      interactive: false,
      icon: L.divIcon({ className: "quad-label", iconSize: [160, 60], iconAnchor: [80, 30],
        html: ql.code + "<small>" + ql.name + "</small><small>" + ql.nrows + " rows · " +
              ql.ncells.toLocaleString() + " cells</small>" })
    }).addTo(frame);
  });
  L.rectangle([[B.south, B.west], [B.north, B.east]], { color: "#111827", weight: 3, fill: false, interactive: false })
    .addTo(frame);
  var dash = { color: "#d9480f", weight: 2, dashArray: "8 6", interactive: false };
  L.polyline([[M.lat, B.west], [M.lat, B.east]], dash).bindTooltip(M.lat.toFixed(3) + "° N", { sticky: true }).addTo(frame);
  L.polyline([[B.south, M.lon], [B.north, M.lon]], dash).bindTooltip(M.lon.toFixed(3) + "° E", { sticky: true }).addTo(frame);

  var corners = [
    ["North-West", B.north, B.west, "right"], ["North-East", B.north, B.east, "left"],
    ["South-West", B.south, B.west, "right"], ["South-East", B.south, B.east, "left"]
  ];
  corners.forEach(function (c) {
    L.circleMarker([c[1], c[2]], { radius: 6, color: "#111827", fillColor: "#fff", fillOpacity: 1, weight: 2 })
      .bindTooltip("<b>" + c[0] + "</b><br>" + c[1].toFixed(3) + "° N, " + c[2].toFixed(3) + "° E",
                   { permanent: true, direction: c[3], className: "corner" })
      .addTo(frame);
  });

  // -- Pakistan's border ------------------------------------------------------
  var borderLayer = L.layerGroup().addTo(map);
  border.rings.forEach(function (ring) {
    L.polyline(ring.map(function (v) { return [v[1] / 1e7, v[0] / 1e7]; }),
               { color: "#047857", weight: 2.5, opacity: 0.9, interactive: false }).addTo(borderLayer);
  });

  // Border flag of a box returned by grid.itemsInBox: [s, w, n, e, quadrant, row, column].
  function boxFlag(b, level) {
    if (level === "cell") return grid.flag(border, b[4], b[5], b[6], null);
    return grid.flag(border, b[4], Math.floor(b[5] / 5), Math.floor(b[6] / 5), (b[5] % 5) * 5 + (b[6] % 5));
  }

  // -- Cell and sub-cell lines, drawn only for the visible area -----------
  var gridLayer = L.layerGroup().addTo(map);
  var labelLayer = L.layerGroup().addTo(map);
  var statusEl = document.getElementById("status");

  // A distinct colour for each place, spread around the colour wheel.
  function placeColour(id) { return "hsl(" + Math.round((id * 137.508) % 360) + ", 70%, 52%)"; }

  // Tehsil of a box returned by grid.itemsInBox (0 = none).
  function boxTag(b, level) {
    if (level === "cell") return places.tag(b[4], b[5], b[6], null);
    return places.tagAt(b[4], b[5], b[6]);
  }

  function drawBoxes(boxes, level, styles, fillByPlace, outlines) {
    boxes.forEach(function (b) {
      var style = outlines ? styles[b.flag] : { stroke: false };
      if (level === "cell" && b.flag !== 0 && boxes.withSubs) style = L.extend({}, style, { weight: 2 });
      var fill = { fill: false };
      if (fillByPlace) {
        var tag = boxTag(b, level);
        if (tag) fill = { fill: true, fillColor: placeColour(tag), fillOpacity: 0.38 };
      }
      if (!outlines && !fill.fill) return;
      L.rectangle([[b[0], b[1]], [b[2], b[3]]], L.extend({ renderer: canvas, interactive: false }, style, fill))
        .addTo(gridLayer);
    });
  }

  // Attach border flags, and drop the boxes outside Pakistan when "Pakistan only" is on.
  function withFlags(boxes, level) {
    if (!boxes) return boxes;
    var pkOnly = document.getElementById("pkonly").checked;
    boxes.forEach(function (b) { b.flag = boxFlag(b, level); });
    return pkOnly ? boxes.filter(function (b) { return b.flag !== 0; }) : boxes;
  }

  function drawLabels(boxes, atTop, className, size, text) {
    boxes.forEach(function (b) {
      var r = grid.locate((b[0] + b[2]) / 2, (b[1] + b[3]) / 2);
      if (!r) return;
      L.marker([atTop ? b[2] : (b[0] + b[2]) / 2, (b[1] + b[3]) / 2], { interactive: false, icon: L.divIcon({
        className: className, iconSize: size, iconAnchor: [size[0] / 2, atTop ? -4 : size[1] / 2], html: text(r) })
      }).addTo(labelLayer);
    });
  }

  function drawGrid() {
    gridLayer.clearLayers();
    labelLayer.clearLayers();
    var z = map.getZoom(), v = map.getBounds();
    var cells = null, subs = null, msg;
    if (z >= CELL_ZOOM) cells = grid.itemsInBox(v.getSouth(), v.getWest(), v.getNorth(), v.getEast(), "cell", LIMIT);
    if (cells && z >= SUB_ZOOM) subs = grid.itemsInBox(v.getSouth(), v.getWest(), v.getNorth(), v.getEast(), "sub", LIMIT);
    cells = withFlags(cells, "cell");
    subs = withFlags(subs, "sub");

    if (z < CELL_ZOOM) msg = "Zoom in to see the ~1 km cells";
    else if (!cells) msg = "Zoom in a little more to draw the cells";
    else {
      var inPk = cells.filter(function (b) { return b.flag !== 0; }).length;
      msg = cells.length.toLocaleString() + " cells in view (" + inPk.toLocaleString() + " in Pakistan)";
      if (subs) msg += " · " + subs.length.toLocaleString() + " sub-cells";
      else msg += z >= SUB_ZOOM ? " · zoom in to see sub-cells" : " · zoom in to see ~200 m sub-cells";
    }

    // sub-cells first, so the cell lines stay on top; with Places on, the smallest boxes drawn are
    // coloured by tehsil
    // with Grid off, no lines or labels are drawn (Places still colours the blocks)
    var byPlace = document.getElementById("placeson").checked, lines = gridOn();
    if (map.hasLayer(frame) !== lines) { if (lines) frame.addTo(map); else map.removeLayer(frame); }
    if (!lines && !byPlace) msg = "Grid hidden: tick Grid to show the cells";
    if (subs) drawBoxes(subs, "sub", SUB_STYLE, byPlace, lines);
    if (cells) { cells.withSubs = !!subs; drawBoxes(cells, "cell", CELL_STYLE, byPlace && !subs, lines); }
    if (lines && cells && z >= CELL_LABEL_ZOOM && cells.length <= 400) {
      drawLabels(cells, true, "cell-label", [96, 12], function (r) { return PakGrid.cellCode(r.q, r.row, r.col); });
    }
    if (lines && subs && z >= SUB_LABEL_ZOOM && subs.length <= 300) {
      drawLabels(subs, false, "sub-label", [20, 12], function (r) { return String(r.subRow * 5 + r.subCol); });
    }
    var c = map.getCenter(), here = grid.locate(c.lat, c.lng);
    var at = here && places.of(here.q, here.row, here.col, here.subRow * 5 + here.subCol, grid);
    if (at) msg += " · Centre: " + at.label;
    else if (document.getElementById("placeson").checked && z < CELL_ZOOM) msg += " · Places: zoom in to colour blocks by tehsil";
    statusEl.textContent = msg;
    statusEl.classList.remove("hide");
  }
  map.on("moveend", drawGrid);
  document.getElementById("pkonly").addEventListener("change", drawGrid);
  document.getElementById("placeson").addEventListener("change", drawGrid);
  // Show or hide the grid; the choice is remembered in this browser.
  function gridOn() { return document.getElementById("gridon").checked; }
  try { if (localStorage.getItem("pakgrid.grid") === "off") document.getElementById("gridon").checked = false; } catch (e) {}
  document.getElementById("gridon").addEventListener("change", function () {
    try { localStorage.setItem("pakgrid.grid", gridOn() ? "on" : "off"); } catch (e) {}
    drawGrid();
  });

  // -- Selection -----------------------------------------------------------
  var selLayer = L.layerGroup().addTo(map);
  var panel = document.getElementById("panel");

  function fmt(x) { return x.toFixed(7); }
  function rowsHtml(rows) {
    return "<table>" + rows.map(function (r) {
      return "<tr><td>" + r[0] + "</td><td class='num'>" + r[1] + "</td></tr>";
    }).join("") + "</table>";
  }
  function boundsRows(b) {
    return [["South", fmt(b.south) + "° N"], ["North", fmt(b.north) + "° N"],
            ["West", fmt(b.west) + "° E"], ["East", fmt(b.east) + "° E"]];
  }
  function sizeText(b) {
    var m = PakGrid.metresPerDegree((b.south + b.north) / 2);
    return Math.round((b.east - b.west) * m.lon) + " m × " + Math.round((b.north - b.south) * m.lat) + " m";
  }

  function countLevel(level) {
    return places.list.filter(function (p) { return p.level === level; }).length.toLocaleString();
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); }
  function placeLink(p) {
    return p ? "<a class='place' data-place='" + p.id + "'>" + esc(p.name) + "</a>" : "–";
  }
  function localityHtml(tags) {
    var loc = tags.locality;
    if (!loc) return "–";
    var html = (tags.near ? "near " : "") + placeLink(loc);
    if (tags.near) html += " (" + PakGrid.formatDistance(tags.localityDistance) + " " + tags.localityDirection + ")";
    return html + " <span class='sub'>" + esc(loc.kind) + (loc.localName ? " · <span dir='rtl'>" + esc(loc.localName) +
           "</span>" : "") + "</span>";
  }
  function placeRows(tags) {
    if (!tags) return [["Place", "outside Pakistan"]];
    return [["Locality", localityHtml(tags)],
            ["Tehsil", placeLink(tags.tehsil)],
            ["District", placeLink(tags.district)],
            ["Province", placeLink(tags.province)]];
  }

  // A province, district, tehsil or locality: zoom to it and describe it.
  function showPlace(p) {
    if (nav.target) nav.close(true);
    selLayer.clearLayers();
    arrow = arrowMarker = null;
    var path = places.path(p), x = p.extent;
    var kids = p.level === "locality" ? [] : places.list.filter(function (c) { return c.parentId === p.id; });
    var html = "<div class='code'>" + esc(p.name) + "</div><div class='sub'>" +
               (p.level === "locality" ? p.kind.charAt(0).toUpperCase() + p.kind.slice(1).replace(/_/g, " ")
                              : p.level.charAt(0).toUpperCase() + p.level.slice(1)) +
               (path.length > 1 ? " · " + path.slice(1).map(placeLink).join(", ") : "") + "</div>";
    var shape = places.shape(grid, p), size = shape.subCells;
    html += rowsHtml([["Key", "<code>" + esc(p.key) + "</code>"], ["Place ID", String(p.id)]]
      .concat(p.localName ? [["Local name", "<span dir='rtl'>" + esc(p.localName) + "</span>"]] : [])
      .concat(p.level === "locality" ? [["Mapped as", p.area ? "an outline" : "a point, " + fmt(p.lat) + ", " + fmt(p.lon)]] : [])
      .concat([["Size", size.toLocaleString() + " sub-cells (≈ " + Math.round(size * 0.04).toLocaleString() + " km²)"]])
      .concat(x ? [["Extent", x[0].toFixed(3) + "–" + x[2].toFixed(3) + "° N, " + x[1].toFixed(3) + "–" + x[3].toFixed(3) + "° E"]] : []));
    if (kids.length) {
      var kidLevel = { province: "Districts", district: "Tehsils", tehsil: "Localities" }[p.level];
      html += "<h3>" + kidLevel + " (" + kids.length + ")</h3><ul class='place-list'>" +
              kids.slice(0, 300).map(function (c) { return "<li>" + placeLink(c) + "</li>"; }).join("") + "</ul>" +
              (kids.length > 300 ? "<p class='sub'>… and " + (kids.length - 300) + " more; search to find one</p>" : "");
    }
    if (p.level === "locality" && !size) {
      html += "<p class='sub'>No sub-cell is tagged with this locality: other localities nearby are nearer.</p>";
    }
    if (p.level === "locality" && !p.area) {
      L.circleMarker([p.lat, p.lon], { radius: 5, color: "#111827", fillColor: "#fff", fillOpacity: 1, weight: 2,
                                       interactive: false }).addTo(selLayer);
    }
    html += "<p class='sub'>The outline is the place's exact area in the grid: every sub-cell tagged with it. " +
            "Blocks are coloured by tehsil while <b>Places</b> is ticked.</p>" +
            "<p><button type='button' id='p-geo'>Download GeoJSON</button> <button type='button' id='clear'>Clear</button></p>";
    panel.innerHTML = html;
    document.getElementById("clear").onclick = function () {
      selLayer.clearLayers(); showSummary(); history.replaceState(null, "", location.pathname);
    };
    document.getElementById("p-geo").onclick = function () {
      downloadGeoJSON(places.geojson(grid, p), p.key.replace(/\//g, "_") + ".geojson");
    };
    document.getElementById("placeson").checked = true;
    if (x) {
      // the place's exact shape (its tagged sub-cells), not just the box around it
      var colour = placeColour(p.id);
      // the outline rings, filled with the even-odd rule (holes stay open), drawn as one shape
      L.polygon(shape.rings, { renderer: canvas, color: "#111827", weight: 2.5, opacity: 0.9, fillColor: colour,
                               fillOpacity: 0.28, fillRule: "evenodd", interactive: false }).addTo(selLayer);
      var view = viewPadding();
      view.maxZoom = 13;
      map.fitBounds([[x[0], x[1]], [x[2], x[3]]], view);
    } else if (p.lat != null) {
      map.setView([p.lat, p.lon], 14);
    }
    drawGrid();
    history.replaceState(null, "", "#place=" + p.key);
  }

  function showPlaceChoices(text, found) {
    panel.innerHTML = "<h2>Places matching “" + esc(text) + "”</h2><ul class='place-list'>" +
      found.slice(0, 60).map(function (p) {
        return "<li>" + placeLink(p) + " <span class='sub'>" + (p.kind ? p.kind.replace(/_/g, " ") : p.level) +
               (p.parentId ? ", " + places.path(p).slice(1).map(function (a) { return esc(a.name); }).join(", ") : "") +
               "</span></li>";
      }).join("") + "</ul>" + (found.length > 60 ? "<p class='sub'>… and " + (found.length - 60) + " more</p>" : "");
  }

  panel.addEventListener("click", function (e) {
    var c = e.target.closest && e.target.closest("a[data-code]");
    if (c) { e.preventDefault(); runQuery(c.getAttribute("data-code")); return; }
    var a = e.target.closest && e.target.closest("a.place");
    if (a && places.byId[a.getAttribute("data-place")]) { e.preventDefault(); showPlace(places.byId[a.getAttribute("data-place")]); }
  });

  function showSummary() {
    var d = PAKGRID_LAYOUT;
    panel.innerHTML =
      "<h2>Pakistan National Grid</h2><div class='sub'>Grid version " + d.grid_version + " · " + d.datum +
      "</div><h3>Rectangle</h3>" + rowsHtml([
        ["North-West", B.north.toFixed(3) + ", " + B.west.toFixed(3)],
        ["North-East", B.north.toFixed(3) + ", " + B.east.toFixed(3)],
        ["South-West", B.south.toFixed(3) + ", " + B.west.toFixed(3)],
        ["South-East", B.south.toFixed(3) + ", " + B.east.toFixed(3)],
        ["Midlines", M.lat.toFixed(3) + "° N, " + M.lon.toFixed(3) + "° E"],
        ["Area", d.area_km2.toLocaleString() + " km²"],
        ["Cells", d.total_cells.toLocaleString()], ["Sub-cells", d.total_sub_cells.toLocaleString()]
      ]) + "<h3>Quadrants</h3>" + rowsHtml(grid.quadrants.map(function (q) {
        return [q.code + " " + q.name, q.areaKm2.toLocaleString() + " km² · " + q.ncells.toLocaleString() + " cells"];
      })) + "<h3>Pakistan border</h3><div class='legend sub'>" +
      "<div><span style='border-color:#047857'></span>Border line</div>" +
      "<div><span style='border-color:#1d4ed8'></span>Cell inside Pakistan</div>" +
      "<div><span style='border-color:#7c3aed'></span>Cell on the border</div>" +
      "<div><span style='border-color:#9ca3af;border-style:dashed'></span>Cell outside Pakistan</div>" +
      "<div style='margin-top:4px'>" + border.attribution + "</div></div>" +
      "<h3>Places</h3>" + rowsHtml([
        ["Provinces", countLevel("province")], ["Districts", countLevel("district")], ["Tehsils", countLevel("tehsil")],
        ["Localities", countLevel("locality")],
        ["Places version", String(places.version)]]) +
      "<div class='sub'>Every cell and sub-cell is tagged with its tehsil, district and province, and with " +
      "a locality (city, town, village, neighbourhood) where one is near. Tick " +
      "<b>Places</b> to colour blocks by tehsil, or search for a place such as <i>Taxila</i> or <i>Kot Addu</i>. " +
      esc(places.attribution) + ".</div>" +
      "<p class='sub'>Tap the map to see the cell and sub-cell at that point. " +
      "Cells appear from zoom " + CELL_ZOOM + ", sub-cells from zoom " + SUB_ZOOM + ".</p>";
  }

  // Arrowhead halfway along the centroid → point line, pointing at the point. Its size follows the
  // line's length on screen, so it never hides the two ends; it is redrawn after each zoom.
  // The map keeps angles true (Web Mercator), so rotating by the compass bearing points the right way.
  var arrow = null, arrowMarker = null;
  function drawArrow() {
    if (arrowMarker) { selLayer.removeLayer(arrowMarker); arrowMarker = null; }
    if (!arrow) return;
    var a = map.latLngToContainerPoint(arrow.from), b = map.latLngToContainerPoint(arrow.to);
    var size = Math.min(22, Math.round(a.distanceTo(b) * 0.45));
    if (size < 8) return;
    arrowMarker = L.marker([(arrow.from[0] + arrow.to[0]) / 2, (arrow.from[1] + arrow.to[1]) / 2], {
      interactive: false,
      icon: L.divIcon({ className: "arrow-head", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
        html: "<svg viewBox='0 0 22 22' style='transform:rotate(" + arrow.bearing.toFixed(1) + "deg)'>" +
              "<path d='M11 2 L19 19 L11 14 L3 19 Z' fill='#2563eb' stroke='#fff' stroke-width='1.5'/></svg>" })
    }).addTo(selLayer);
  }
  map.on("zoomend", drawArrow);

  // Select the block at a point (from a tap, a search or GPS), or a block by code.
  function select(opts) {
    selLayer.clearLayers();
    arrow = arrowMarker = null;
    var r = opts.loc;
    var cell = grid.describe(r.q, r.row, r.col, null);
    var sub = r.sub == null ? null : grid.describe(r.q, r.row, r.col, r.sub);
    var cb = cell.bounds;
    L.rectangle([[cb.south, cb.west], [cb.north, cb.east]], { color: "#d9480f", weight: 3, fill: false,
      interactive: false }).addTo(selLayer);
    L.circleMarker(cell.centroid, { radius: 5, color: "#111827", fillColor: "#111827", fillOpacity: 1 })
      .bindTooltip("Cell centroid").addTo(selLayer);
    var html = "";
    if (sub) {
      var sb = sub.bounds;
      L.rectangle([[sb.south, sb.west], [sb.north, sb.east]], { color: "#d9480f", weight: 2, fillColor: "#d9480f",
        fillOpacity: 0.25, interactive: false }).addTo(selLayer);
      L.circleMarker(sub.centroid, { radius: 5, color: "#d9480f", fillColor: "#fff", fillOpacity: 1, weight: 3 })
        .bindTooltip("Sub-cell centroid").addTo(selLayer);
      html += "<div class='code'>" + sub.code + "</div><div class='sub'>Sub-cell ID " + sub.id +
              " · cell " + cell.code + " (ID " + cell.id + ")</div>";
    } else {
      html += "<div class='code'>" + cell.code + "</div><div class='sub'>Cell ID " + cell.id + "</div>";
    }
    if (opts.point) {
      var p = opts.point;
      L.circleMarker(p, { radius: 6, color: "#2563eb", fillColor: "#2563eb", fillOpacity: 1 }).addTo(selLayer);
      if (opts.accuracy) {
        L.circle(p, { radius: opts.accuracy, color: "#2563eb", weight: 1, fillOpacity: 0.08, interactive: false })
          .addTo(selLayer);
      }
      var off = PakGrid.localOffset(sub.centroid[0], sub.centroid[1], p[0], p[1]);
      var dir = PakGrid.compass(off.bearing);
      L.polyline([sub.centroid, p], { color: "#2563eb", weight: 3, interactive: false }).addTo(selLayer);
      arrow = { from: sub.centroid, to: p, bearing: off.bearing };
      drawArrow();
      var sb2 = sub.bounds, m = PakGrid.metresPerDegree(sub.centroid[0]);
      var edge = Math.max(0, Math.min((p[0] - sb2.south) * m.lat, (sb2.north - p[0]) * m.lat,
                                      (p[1] - sb2.west) * m.lon, (sb2.east - p[1]) * m.lon));
      var addr = grid.addressFromPoint(p[0], p[1]);
      var pointRows = [["Point", fmt(p[0]) + ", " + fmt(p[1])], ["Grid address", addr ? addr.text : "–"],
                       ["Centroid → point", off.text + " · " + off.distance.toFixed(1) + " m"],
                       ["Direction", Math.round(off.bearing) + "° " + dir.short + " (" + dir.name + ")"],
                       ["Nearest edge", edge.toFixed(1) + " m"]];
      var subFlag = grid.flag(border, r.q, r.row, r.col, sub.sub);
      var pointIn = subFlag === 2 || (subFlag === 1 && border.contains(p[0], p[1]));
      pointRows.push(["In Pakistan", pointIn ? "yes" : "no"]);
      if (opts.accuracy) {
        pointRows.push(["GPS accuracy", Math.round(opts.accuracy) + " m"]);
        pointRows.push(["Confident", edge >= opts.accuracy ? "yes" : "no: could be a neighbouring block"]);
      }
      html += "<h3>Point</h3>" + rowsHtml(pointRows) +
              "<div class='sub'>The arrow runs from the sub-cell's centre (orange ring) to the point (blue dot). " +
              "Directions are compass bearings, clockwise from north: 0° N, 90° E, 180° S, 270° W.</div>";
    }
    html += "<h3>Location in the grid</h3>" + rowsHtml([
      ["Quadrant", grid.quadrants[r.q].code + " " + grid.quadrants[r.q].name],
      ["Row / column", r.row + " / " + r.col]].concat(sub ? [["Sub-cell", sub.sub + " (row " +
        Math.floor(sub.sub / 5) + ", column " + (sub.sub % 5) + ")"]] : []).concat(
      [["Cell in Pakistan", FLAG[grid.flag(border, r.q, r.row, r.col, null)]]]).concat(
      sub ? [["Sub-cell in Pakistan", FLAG[grid.flag(border, r.q, r.row, r.col, sub.sub)]]] : []));
    var subTags = sub ? places.of(r.q, r.row, r.col, sub.sub, grid) : null;
    var cellTags = places.of(r.q, r.row, r.col, null, grid);
    html += "<h3>Place" + (sub ? " (sub-cell)" : " (cell)") + "</h3>" + rowsHtml(placeRows(sub ? subTags : cellTags));
    if (sub && cellTags && (!subTags || subTags.tehsil.id !== cellTags.tehsil.id)) {
      html += "<div class='sub'>A tehsil line runs through this cell; most of it is in " + placeLink(cellTags.tehsil) + ".</div>";
    } else if (!sub && cellTags) {
      var inCell = {};
      for (var sk = 0; sk < 25; sk++) {
        var st = places.tag(r.q, r.row, r.col, sk);
        if (st) inCell[st] = (inCell[st] || 0) + 1;
      }
      var cellPlaceIds = Object.keys(inCell);
      if (cellPlaceIds.length > 1) {
        html += "<div class='sub'>A tehsil line runs through this cell: " + cellPlaceIds.map(function (id) {
          return placeLink(places.byId[id]) + " (" + inCell[id] + " of 25 sub-cells)"; }).join(", ") + ".</div>";
      }
    }
    if (sub) {
      html += "<h3>Sub-cell · " + sizeText(sub.bounds) + "</h3>" +
              rowsHtml([["Centroid", fmt(sub.centroid[0]) + ", " + fmt(sub.centroid[1])]].concat(boundsRows(sub.bounds)));
    }
    html += "<h3>Cell · " + sizeText(cb) + "</h3>" +
            rowsHtml([["Centroid", fmt(cell.centroid[0]) + ", " + fmt(cell.centroid[1])]].concat(boundsRows(cb)));
    html += "<h3>Around " + (opts.point ? "this point" : "this block") + "</h3>" +
            "<div class='around'><input id='a-radius' type='number' min='0' max='50000' step='100' value='" + aroundRadius +
            "' aria-label='Radius in metres'> m <select id='a-level'><option value='cell'>cells</option>" +
            "<option value='sub'" + (aroundLevel === "sub" ? " selected" : "") + ">sub-cells</option></select> " +
            "<label><input type='checkbox' id='a-touch'" + (aroundTouching ? " checked" : "") + "> touching</label> " +
            "<button type='button' id='a-go'>Find</button></div><div id='a-out'></div>";
    html += "<p><button type='button' class='go' id='navigate'>Navigate here</button> " +
            "<button type='button' id='measure-from'>Measure from here</button> " +
            "<button type='button' id='b-geo'>GeoJSON</button> " +
            "<button type='button' id='clear'>Clear</button></p>";
    panel.innerHTML = html;
    document.getElementById("b-geo").onclick = function () {
      var feats = [grid.blockGeoJSON(r.q, r.row, r.col, null, border)];
      if (sub) feats.push(grid.blockGeoJSON(r.q, r.row, r.col, sub.sub, border));
      downloadGeoJSON({ type: "FeatureCollection", features: feats }, (sub || cell).code + ".geojson");
    };
    var centre = opts.point || (sub || cell).centroid;
    document.getElementById("a-go").onclick = function () {
      aroundRadius = +document.getElementById("a-radius").value;
      aroundLevel = document.getElementById("a-level").value;
      aroundTouching = document.getElementById("a-touch").checked;
      showAround(centre[0], centre[1]);
    };
    document.getElementById("measure-from").onclick = function () { startMeasure(r); };
    // The pin to navigate to: the exact point if one was chosen, else the block's centre.
    var navTarget = opts.point ? { lat: opts.point[0], lon: opts.point[1], label: addr ? addr.text : (sub || cell).code + " (pin)" }
                               : { lat: (sub || cell).centroid[0], lon: (sub || cell).centroid[1], label: (sub || cell).code };
    document.getElementById("navigate").onclick = function () { startNavigation(navTarget); };
    document.getElementById("clear").onclick = function () {
      selLayer.clearLayers(); arrow = arrowMarker = null; showSummary(); history.replaceState(null, "", location.pathname);
    };
    if (opts.fly) {
      var target = sub ? sub.bounds : cb, view = viewPadding();
      view.maxZoom = opts.point ? 17 : sub ? 16 : 14;   // closer for points, so the arrow shows
      view.animate = !opts.instant;
      map.fitBounds([[target.south, target.west], [target.north, target.east]], view);
    }
    history.replaceState(null, "", "#" + (opts.point ? opts.point[0].toFixed(7) + "," + opts.point[1].toFixed(7)
                                                       : (sub ? sub.code : cell.code)));
  }

  // -- Radius search (Grid.cells_within) --------------------------------------------
  var aroundRadius = 1000, aroundLevel = "cell", aroundTouching = false, aroundLayer = null;
  function showAround(lat, lon) {
    var out = document.getElementById("a-out");
    if (aroundLayer) selLayer.removeLayer(aroundLayer);
    aroundLayer = L.layerGroup().addTo(selLayer);
    if (!(aroundRadius >= 0 && aroundRadius <= 50000)) { out.innerHTML = "<p class='error'>The radius must be 0 to 50,000 m.</p>"; return; }
    var found = grid.cellsWithin(lat, lon, aroundRadius, aroundLevel,
                                 { touching: aroundTouching, boundary: border, pakistanOnly: document.getElementById("pkonly").checked });
    L.circle([lat, lon], { radius: aroundRadius, color: "#2563eb", weight: 2, fill: false, interactive: false }).addTo(aroundLayer);
    found.slice(0, 20000).forEach(function (c) {
      L.rectangle([[c.bounds[0], c.bounds[1]], [c.bounds[2], c.bounds[3]]], { renderer: canvas, color: "#2563eb",
        weight: 0.5, fillColor: "#2563eb", fillOpacity: 0.18, interactive: false }).addTo(aroundLayer);
    });
    var kind = aroundLevel === "cell" ? "cells" : "sub-cells";
    out.innerHTML = "<p><b>" + found.length.toLocaleString() + " " + kind + "</b> within " +
      PakGrid.formatDistance(aroundRadius) + (aroundTouching ? " (any part)" : " (centre)") + ". Nearest:</p>" +
      rowsHtml(found.slice(0, 10).map(function (c) {
        return ["<a class='place' data-code='" + c.code + "'>" + c.code + "</a>",
                PakGrid.formatDistance(c.distance_m) + " " + PakGrid.compass(c.bearing_deg).short];
      })) + "<div class='sub'>Distances run from the point to each block's centre" +
      (aroundTouching ? " (to its nearest edge for “touching”)" : "") + ". Same as <code>grid.cells_within(...)</code>.</div>" +
      "<p><button type='button' id='a-geo'>Download GeoJSON</button></p>";
    document.getElementById("a-geo").onclick = function () {
      downloadGeoJSON({ type: "FeatureCollection", features: found.map(function (c) {
        var f = grid.blockGeoJSON(c.q, c.row, c.col, c.sub);
        f.properties.distance_m = Math.round(c.distance_m * 10) / 10;
        f.properties.bearing_deg = Math.round(c.bearing_deg * 10) / 10;
        return f;
      }) }, "within-" + aroundRadius + "m.geojson");
    };
    var view = viewPadding(); view.maxZoom = 16;
    map.fitBounds(L.latLng(lat, lon).toBounds(2 * Math.max(aroundRadius, 200) * 1.1), view);
  }

  // -- Measure (Grid.distance) -------------------------------------------------------
  // Tap a block, then another: the distance and direction between their centres.
  var measuring = null, measureBtn = document.getElementById("measure");
  function blockAt(lat, lon) {
    var r = grid.locate(lat, lon);
    if (!r) return null;
    // at sub-cell zoom, measure between sub-cells; further out, between cells
    return { q: r.q, row: r.row, col: r.col, sub: map.getZoom() >= SUB_ZOOM ? r.subRow * 5 + r.subCol : null };
  }
  function startMeasure(from) {
    if (nav.target) nav.close(true);
    if (drawing) stopDrawing();
    if (zoning) stopZone();
    selLayer.clearLayers(); arrow = arrowMarker = null;
    measuring = { from: from ? { q: from.q, row: from.row, col: from.col, sub: from.sub == null ? null : from.sub } : null };
    measureBtn.classList.add("on");
    showMeasure();
  }
  function stopMeasure() {
    measuring = null;
    measureBtn.classList.remove("on");
    selLayer.clearLayers();
    showSummary();
  }
  measureBtn.addEventListener("click", function () { if (measuring) stopMeasure(); else startMeasure(null); });
  function measureTap(lat, lon) {
    var b = blockAt(lat, lon);
    if (!b) { flash("That point is outside the grid rectangle"); return; }
    if (!measuring.from || measuring.to) { measuring.from = b; measuring.to = null; } else measuring.to = b;
    showMeasure();
  }
  function showMeasure(fit) {
    var m = measuring;
    selLayer.clearLayers();
    [m.from, m.to].forEach(function (b, k) {
      if (!b) return;
      var d = grid.describe(b.q, b.row, b.col, b.sub), x = d.bounds;
      L.rectangle([[x.south, x.west], [x.north, x.east]], { color: k ? "#2563eb" : "#d9480f", weight: 2.5,
        fillOpacity: 0.2, interactive: false }).addTo(selLayer);
      L.circleMarker(d.centroid, { radius: 5, color: "#111827", fillColor: "#fff", fillOpacity: 1, weight: 2,
        interactive: false }).addTo(selLayer);
    });
    var html = "<h2>Measure</h2>";
    if (!m.from) html += "<div class='sub'>Tap the first block (cells below zoom " + SUB_ZOOM + ", sub-cells from it), " +
                         "or search for two codes: <i>11-0140-0471 to 11-0150-0480</i>.</div>";
    else if (!m.to) html += "<div class='sub'>From <b>" + grid.describe(m.from.q, m.from.row, m.from.col, m.from.sub).code +
                            "</b>. Now tap the second block.</div>";
    else {
      var r = grid.distance(m.from, m.to), a = grid.describe(m.from.q, m.from.row, m.from.col, m.from.sub),
          b = grid.describe(m.to.q, m.to.row, m.to.col, m.to.sub);
      L.polyline([a.centroid, b.centroid], { color: "#111827", weight: 2.5, dashArray: "6 4", interactive: false }).addTo(selLayer);
      html += "<div class='code'>" + esc(r.text) + "</div>" + rowsHtml([
        ["From", r.from], ["To", r.to],
        ["Distance", r.distance_m >= 1000 ? (r.distance_m / 1000).toFixed(3) + " km" : r.distance_m.toFixed(1) + " m"],
        ["Direction", Math.round(r.bearing_deg) + "° " + r.compass_short + " (" + r.compass + ")"],
        ["East / north", Math.round(r.east_m).toLocaleString() + " m / " + Math.round(r.north_m).toLocaleString() + " m"]]) +
        "<div class='sub'>Straight line between the two blocks' centres. Same as <code>grid.distance(\"" + r.from +
        "\", \"" + r.to + "\")</code>. Tap again to start a new measurement.</div>";
      if (fit) {
        var view = viewPadding(); view.maxZoom = 16;
        map.fitBounds([a.centroid, b.centroid], view);
      }
    }
    html += "<p><button type='button' id='m-done'>Done</button></p>";
    panel.innerHTML = html;
    document.getElementById("m-done").onclick = stopMeasure;
  }

  // Save GeoJSON as a file (RFC 7946: application/geo+json).
  function downloadGeoJSON(obj, name) {
    var url = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: "application/geo+json" }));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function selectPoint(lat, lon, fly, accuracy, instant) {
    var r = grid.locate(lat, lon);
    if (!r) { flash("That point is outside the grid rectangle"); return false; }
    r.sub = r.subRow * 5 + r.subCol;
    select({ loc: r, point: [lat, lon], fly: fly, accuracy: accuracy, instant: instant });
    return true;
  }

  function flash(text) {
    statusEl.textContent = text;
    statusEl.classList.remove("hide");
    setTimeout(drawGrid, 2500);
  }

  map.on("click", function (e) {
    if (nav.target) return;   // while navigating, taps don't change the selection
    if (drawing) { addVertex(e.latlng.lat, e.latlng.lng); return; }
    if (zoning) { zoneTap(e.latlng.lat, e.latlng.lng); return; }
    if (measuring) { measureTap(e.latlng.lat, e.latlng.lng); return; }
    selectPoint(e.latlng.lat, e.latlng.lng, false);
  });

  // -- Custom zones (pakgrid.zones) ------------------------------------------------
  // Tap corners to draw a zone, press Done: the sub-cells whose centre is inside it are shaded.
  // Then taps check pins against it (green inside, red outside). Its data (Zone.to_dict) can be
  // copied, or a stored zone pasted in to see it.
  var zoning = null, zoneBtn = document.getElementById("zonebtn");
  function startZone() {
    if (nav.target) nav.close(true);
    if (drawing) stopDrawing();
    if (measuring) stopMeasure();
    selLayer.clearLayers(); arrow = arrowMarker = null;
    zoning = { pts: [], zone: null, pins: [] };
    zoneBtn.classList.add("on");
    map.doubleClickZoom.disable();
    showZone();
  }
  function stopZone() {
    zoning = null;
    zoneBtn.classList.remove("on");
    map.doubleClickZoom.enable();
    selLayer.clearLayers();
    showSummary();
  }
  zoneBtn.addEventListener("click", function () { if (zoning) stopZone(); else startZone(); });
  function zoneTap(lat, lon) {
    var z = zoning;
    if (z.zone) {
      var inside = z.zone.contains(lat, lon), r = grid.locate(lat, lon);
      z.pins.unshift({ lat: lat, lon: lon, inside: inside,
                       code: r ? PakGrid.subCellCode(r.q, r.row, r.col, r.subRow * 5 + r.subCol) : "outside the grid" });
      z.pins = z.pins.slice(0, 8);
    } else {
      z.pts.push([+lat.toFixed(7), +lon.toFixed(7)]);
    }
    showZone();
  }
  function finishZone() {
    var z = zoning;
    try {
      z.zone = grid.zoneFromPolygon(z.pts, { boundary: border, pakistanOnly: document.getElementById("pkonly").checked });
      z.error = null;
    } catch (err) { z.error = err.message; z.zone = null; }
    z.pins = [];
    showZone(true);
  }
  function showZone(fit) {
    var z = zoning;
    selLayer.clearLayers();
    if (z.zone) {
      var boxes = z.zone.boxes();
      boxes.slice(0, 30000).forEach(function (b) {
        L.rectangle([[b[0], b[1]], [b[2], b[3]]], { renderer: canvas, stroke: !b[4] || boxes.length < 3000,
          color: "#16a34a", weight: 0.5, fillColor: "#16a34a", fillOpacity: 0.3, interactive: false }).addTo(selLayer);
      });
    }
    if (z.pts.length) {
      (z.pts.length >= 3 ? L.polygon(z.pts, { fill: false }) : L.polyline(z.pts))
        .setStyle({ color: "#111827", weight: 2, dashArray: z.zone ? "4 4" : null, interactive: false }).addTo(selLayer);
      if (!z.zone) z.pts.forEach(function (p) {
        L.circleMarker(p, { radius: 4, color: "#111827", fillColor: "#fff", fillOpacity: 1, weight: 2, interactive: false }).addTo(selLayer);
      });
    }
    z.pins.forEach(function (p) {
      L.circleMarker([p.lat, p.lon], { radius: 7, color: "#fff", weight: 2, fillOpacity: 1,
        fillColor: p.inside ? "#16a34a" : "#dc2626", interactive: false }).addTo(selLayer);
    });
    var html = "<h2>Custom zone</h2>";
    if (!z.zone) {
      html += "<div class='sub'>Tap the map at each corner of the delivery area, then press <b>Done</b>. A sub-cell " +
              "is in the zone when its centre is inside the shape" +
              (document.getElementById("pkonly").checked ? " and it is in Pakistan" : "") + ".</div>" +
              "<p><button type='button' id='z-undo'" + (z.pts.length ? "" : " disabled") + ">Undo</button> " +
              "<button type='button' id='z-done' class='on'" + (z.pts.length >= 3 ? "" : " disabled") + ">Done</button> " +
              "<button type='button' id='z-cancel'>Cancel</button></p>" +
              (z.error ? "<p class='error'>" + esc(z.error) + "</p>" : "") +
              "<h3>Or show a stored zone</h3><textarea id='z-paste' placeholder='Paste zone JSON (Zone.to_dict())'></textarea>" +
              "<p><button type='button' id='z-load'>Show it</button></p>";
    } else {
      var zz = z.zone, n = zz.subCellCount(), d = zz.toDict();
      html += rowsHtml([["Sub-cells", n.toLocaleString()],
                        ["Cells", zz.cellIds().length.toLocaleString() + " (" + d.full.length.toLocaleString() + " whole)"],
                        ["Area", zz.areaKm2().toFixed(2) + " km²"]]);
      html += "<h3>Check pins</h3><div class='sub'>Tap the map: green is in the zone, red is not. The check is " +
              "<code>zone.contains(lat, lon)</code>: is the pin's sub-cell in the zone?</div>";
      if (z.pins.length) html += rowsHtml(z.pins.map(function (p) {
        return [p.inside ? "<b style='color:#16a34a'>inside</b>" : "<b style='color:#dc2626'>outside</b>",
                fmt(p.lat).slice(0, 9) + ", " + fmt(p.lon).slice(0, 9) + " · " + p.code];
      }));
      html += "<h3>Zone data</h3><textarea id='z-json' readonly></textarea>" +
              "<div class='sub'>Store this (for example in a JSONField) and load it with " +
              "<code>Zone.from_dict(data, grid)</code>; it is the same as <code>grid.zone(polygon=...).to_dict()</code>" +
              (z.pts.length ? " for <code>polygon=" + esc(JSON.stringify(z.pts)) + "</code>" : "") + ".</div>" +
              "<p><button type='button' id='z-geo'>Download GeoJSON</button> <button type='button' id='z-new'>New zone</button> " +
              "<button type='button' id='z-cancel'>Done</button></p>";
    }
    panel.innerHTML = html;
    var q = function (id) { return document.getElementById(id); };
    q("z-cancel").onclick = stopZone;
    if (!z.zone) {
      q("z-undo").onclick = function () { z.pts.pop(); showZone(); };
      q("z-done").onclick = finishZone;
      q("z-load").onclick = function () {
        try {
          z.zone = PakGrid.Zone.fromDict(grid, JSON.parse(q("z-paste").value));
          z.pts = []; z.pins = []; z.error = null;
        } catch (err) { z.error = "Not zone data: " + err.message; }
        showZone(true);
      };
    } else {
      q("z-json").value = JSON.stringify(z.zone.toDict());
      q("z-geo").onclick = function () { downloadGeoJSON(z.zone.toGeoJSON(), "zone.geojson"); };
      q("z-new").onclick = function () { z.zone = null; z.pts = []; z.pins = []; showZone(); };
      if (fit) {
        var ids = z.zone.cellIds(), s = 90, w = 180, nn = -90, e = -180;
        ids.forEach(function (c) {
          var b = grid.describe(Math.floor(c / 1048576), Math.floor(c / 1024) % 1024, c % 1024, null).bounds;
          s = Math.min(s, b.south); w = Math.min(w, b.west); nn = Math.max(nn, b.north); e = Math.max(e, b.east);
        });
        if (ids.length) { var view = viewPadding(); view.maxZoom = 16; map.fitBounds([[s, w], [nn, e]], view); }
      }
    }
  }

  // -- Draw a user locality (pakgrid.userplaces) ---------------------------------
  // Tap corners to draw a polygon; the panel shows the sub-cells it would tag (centre inside, in
  // Pakistan), its tehsil, and where it is from the nearest known localities, plus the call that
  // adds it with the library. Nothing is stored here: the viewer has no backend.
  var drawing = null, drawBtn = document.getElementById("draw");
  function startDrawing() {
    if (nav.target) nav.close(true);
    if (measuring) stopMeasure();
    if (zoning) stopZone();
    selLayer.clearLayers();
    arrow = arrowMarker = null;
    drawing = { pts: [], name: "", nearest: 3 };
    drawBtn.classList.add("on");
    map.doubleClickZoom.disable();
    showDrawing();
  }
  function stopDrawing() {
    drawing = null;
    drawBtn.classList.remove("on");
    map.doubleClickZoom.enable();
    selLayer.clearLayers();
    showSummary();
  }
  drawBtn.addEventListener("click", function () { if (drawing) stopDrawing(); else startDrawing(); });
  function addVertex(lat, lon) {
    drawing.pts.push([+lat.toFixed(7), +lon.toFixed(7)]);
    drawing.preview = null;
    showDrawing();
  }
  function showDrawing() {
    var d = drawing, pts = d.pts;
    selLayer.clearLayers();
    if (pts.length >= 3 && d.preview && d.preview.subCells) {
      d.preview.subCells.slice(0, 5000).forEach(function (c) {
        L.rectangle([[c.bounds[0], c.bounds[1]], [c.bounds[2], c.bounds[3]]], { renderer: canvas, color: "#d9480f",
          weight: 0.6, fillColor: "#d9480f", fillOpacity: 0.35, interactive: false }).addTo(selLayer);
      });
    }
    if (pts.length) {
      (pts.length >= 3 ? L.polygon(pts, { fill: false }) : L.polyline(pts))
        .setStyle({ color: "#111827", weight: 2.5, dashArray: d.preview ? null : "6 4", interactive: false }).addTo(selLayer);
      pts.forEach(function (p) {
        L.circleMarker(p, { radius: 4, color: "#111827", fillColor: "#fff", fillOpacity: 1, weight: 2,
                            interactive: false }).addTo(selLayer);
      });
    }
    var html = "<h2>Draw a locality</h2><div class='sub'>Tap the map at each corner, then press <b>Done</b>. " +
               "A sub-cell is tagged when its centre is inside the shape.</div>" +
               "<p><button type='button' id='d-undo'" + (pts.length ? "" : " disabled") + ">Undo</button> " +
               "<button type='button' id='d-done' class='on'" + (pts.length >= 3 ? "" : " disabled") + ">Done</button> " +
               "<button type='button' id='d-cancel'>Cancel</button></p>";
    var pv = d.preview;
    if (pv && pv.error) html += "<p class='error'>" + esc(pv.error) + "</p>";
    if (pv && !pv.error) {
      var t = pv.tehsil, path = places.path(t);
      html += "<h3>New locality</h3><input class='name' id='d-name' placeholder='Name, e.g. Gali 7' value='" +
              esc(d.name) + "'>" + rowsHtml([
                ["Sub-cells", pv.subCells.length.toLocaleString() + " (≈ " + (pv.subCells.length * 0.04).toFixed(2) + " km²)"],
                ["Tehsil", path.map(placeLink).join(", ")],
                ["Centre", fmt(pv.centre[0]) + ", " + fmt(pv.centre[1])]]) +
              "<h3>Where it is (nearest " + pv.references.length + ")</h3>" + rowsHtml(pv.references.map(function (r) {
                return [placeLink(places.list.filter(function (p) { return p.key === r.key; })[0]),
                        PakGrid.formatDistance(r.distance_m) + " " + r.direction + " · " + Math.round(r.bearing_deg) + "°" +
                        (r.tooFar ? " <span class='warn'>too far</span>" : "")];
              })) +
              "<div class='sub'>Distance and direction from each known locality to the new one's centre, " +
              "e.g. <i>" + esc(pv.references[0] ? pv.references[0].text : "") + "</i>.</div>" +
              "<h3>Add it with the library</h3><textarea id='d-code' readonly></textarea>" +
              "<div class='sub'>Run this in your backend (it checks who may edit; the library records the author " +
              "and keeps a history). See project.md §5.8.</div>";
    }
    panel.innerHTML = html;
    document.getElementById("d-undo").onclick = function () { pts.pop(); d.preview = null; showDrawing(); };
    document.getElementById("d-cancel").onclick = stopDrawing;
    document.getElementById("d-done").onclick = function () {
      d.preview = places.userPreview(grid, pts, d.nearest);
      showDrawing();
    };
    var nameEl = document.getElementById("d-name");
    if (nameEl) {
      var code = document.getElementById("d-code");
      var update = function () {
        d.name = nameEl.value;
        code.value = "user = grid.attach_user_places(\"user_places.sqlite\")\n" +
          "user.add(" + JSON.stringify(d.name || "New locality") + ", author=request.user.username,\n" +
          "         polygon=" + JSON.stringify(pts) + ",\n         nearest=" + d.nearest + ")";
      };
      nameEl.addEventListener("input", update);
      update();
    }
  }

  // -- Navigate mode (viewer/navigation.js) ------------------------------------
  var nav = new PakNav.Navigator({
    map: map, grid: grid, panel: panel, flash: flash,
    onExit: function () { showSummary(); history.replaceState(null, "", location.pathname); }
  });
  nav.padding = viewPadding;

  function startNavigation(target) {
    selLayer.clearLayers();
    arrow = arrowMarker = null;
    nav.open(target);
    nav.recenter();
    history.replaceState(null, "", "#nav=" + target.lat.toFixed(7) + "," + target.lon.toFixed(7));
  }

  function runQuery(text, instant) {
    text = text.trim();
    var navm = /^nav=(.*)$/.exec(text);
    if (navm) {
      var to = pointFromText(navm[1]);
      var a = to && grid.addressFromPoint(to[0], to[1]);
      if (!a) { flash("That point is outside the grid rectangle"); return; }
      startNavigation({ lat: to[0], lon: to[1], label: a.text });
      return;
    }
    if (nav.target) nav.close(true);
    var parsed = grid.parseCode(text);
    if (parsed) { select({ loc: parsed, fly: true, instant: instant }); return; }
    var pt = pointFromText(text);
    if (pt) { selectPoint(pt[0], pt[1], true, undefined, instant); return; }
    var pm = /^place=(.+)$/.exec(text), want = (pm ? pm[1] : text).trim().toLowerCase();
    var found = places.find(want);
    var exact = found.filter(function (p) { return p.key === want || p.name.toLowerCase() === want; });
    if (exact.length > 1) {   // 'Lahore': the district before the city of the same name
      var LEVELS = ["province", "district", "tehsil", "locality"];
      var top = Math.min.apply(null, exact.map(function (p) { return LEVELS.indexOf(p.level); }));
      exact = exact.filter(function (p) { return LEVELS.indexOf(p.level) === top; });
    }
    if (exact.length === 1 || found.length === 1) { showPlace(exact.length === 1 ? exact[0] : found[0]); return; }
    if (found.length) { showPlaceChoices(text, found); return; }
    flash("Enter a place (Taxila), a grid address such as 11-0140-0471-00 W23 S18, a code, or lat, lon");
  }

  // [lat, lon] from 'lat, lon' or a grid address ('11-0140-0471-00 W23 S18'); null otherwise.
  function pointFromText(text) {
    var m = /^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(text);
    return m ? [+m[1], +m[2]] : grid.resolveAddress(text);
  }

  document.getElementById("search").addEventListener("submit", function (e) {
    e.preventDefault();
    if (drawing) stopDrawing();
    if (zoning) stopZone();
    var two = /^\s*(\S+)\s+(?:to|-|→)\s+(\S+)\s*$/i.exec(document.getElementById("q").value);
    if (two && grid.parseCode(two[1]) && grid.parseCode(two[2])) {     // '11-0140-0471 to 11-0150-0480'
      startMeasure(grid.parseCode(two[1]));
      measuring.to = grid.parseCode(two[2]);
      showMeasure(true);
      return;
    }
    if (measuring) stopMeasure();
    runQuery(document.getElementById("q").value);
  });

  document.getElementById("me").addEventListener("click", function () {
    if (!navigator.geolocation) { flash("This browser cannot share its location"); return; }
    flash("Finding your location…");
    navigator.geolocation.getCurrentPosition(function (pos) {
      selectPoint(pos.coords.latitude, pos.coords.longitude, true, pos.coords.accuracy);
    }, function (err) { flash("Location unavailable: " + err.message); },
    { enableHighAccuracy: true, timeout: 15000 });
  });

  showSummary();
  drawGrid();
  if (location.hash.length > 1) runQuery(decodeURIComponent(location.hash.slice(1)), true);
})();
</script>
</body>
</html>
